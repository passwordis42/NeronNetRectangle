<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>神经网络像素画布可视化</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #181818;
      --muted: #5f6368;
      --surface: #fbfbfb;
      --panel: #ffffff;
      --line: #d9dde0;
      --line-strong: #aeb6bb;
      --dark: #111111;
      --teal: #009f7a;
      --pink: #e43f64;
      --yellow: #f1d54a;
      --gray: #edf0f1;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.08);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.035) 1px, transparent 1px),
        linear-gradient(0deg, rgba(0, 0, 0, 0.035) 1px, transparent 1px),
        #f5f6f6;
      background-size: 28px 28px;
      color: var(--ink);
      font-family: "Trebuchet MS", "Microsoft YaHei", "PingFang SC", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
      letter-spacing: 0;
    }

    button {
      border: 1px solid var(--dark);
      border-radius: var(--radius);
      background: var(--dark);
      color: #fff;
      min-height: 36px;
      padding: 8px 12px;
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.16);
    }

    button.secondary {
      background: #fff;
      color: var(--ink);
    }

    button.danger {
      background: var(--pink);
      border-color: var(--pink);
    }

    input,
    select {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      min-height: 34px;
      padding: 6px 8px;
    }

    input[type="range"] {
      padding: 0;
      accent-color: var(--teal);
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .topbar {
      display: grid;
      gap: 10px;
      padding: 22px clamp(14px, 4vw, 34px) 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(16px);
    }

    .topbar h1 {
      margin: 0;
      font-size: clamp(26px, 42px, 46px);
      line-height: 1;
      max-width: 920px;
    }

    .topbar p {
      margin: 0;
      max-width: 860px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(260px, 330px) minmax(0, 1fr) minmax(290px, 360px);
      gap: 14px;
      padding: 14px;
      min-height: calc(100vh - 126px);
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
    }

    .side {
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .section {
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .section + .section {
      border-top: 1px solid var(--line);
    }

    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title h2,
    .section-title h3 {
      margin: 0;
      font-size: 16px;
    }

    .section-title span,
    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .pixel-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(42px, 1fr));
      gap: 7px;
      touch-action: none;
      user-select: none;
    }

    .pixel {
      aspect-ratio: 1;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      display: grid;
      place-items: center;
      color: #fff;
      font-family: Consolas, "Microsoft YaHei", monospace;
      font-size: 13px;
      cursor: crosshair;
      transition: transform 120ms ease, border-color 120ms ease;
    }

    .pixel:hover {
      transform: scale(1.03);
      border-color: var(--dark);
    }

    .brush-readout {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .brush-chip {
      display: inline-grid;
      place-items: center;
      min-width: 52px;
      min-height: 34px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      font-family: Consolas, monospace;
      font-weight: 700;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .network-panel {
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
    }

    .network-head {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .network-head h2 {
      margin: 0;
      font-size: 18px;
    }

    .metric-strip {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .network-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .mode-button {
      min-height: 34px;
      padding: 7px 10px;
      background: #fff;
      color: var(--ink);
    }

    .mode-button.is-active {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
    }

    .mode-group {
      display: inline-flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .mode-group .hint {
      margin-right: 2px;
    }

    .zoom-control {
      display: grid;
      grid-template-columns: 64px 120px 46px;
      gap: 7px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      padding: 7px 9px;
      color: var(--muted);
      font-size: 12px;
    }

    .zoom-control input {
      min-height: 20px;
    }

    .zoom-control b {
      color: var(--ink);
      font-family: Consolas, monospace;
      text-align: right;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      padding: 7px 9px;
      display: grid;
      gap: 2px;
      min-width: 88px;
    }

    .metric b {
      font-size: 14px;
    }

    .metric span {
      color: var(--muted);
      font-size: 11px;
    }

    .network-scroll {
      overflow: auto;
      min-height: 560px;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.05) 1px, transparent 1px),
        #fbfbfb;
      background-size: 22px 22px;
    }

    .network-canvas {
      position: relative;
      min-width: 100%;
      min-height: 100%;
      width: max-content;
      padding: 28px 28px 48px;
      transform-origin: 0 0;
    }

    .connections {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .layers {
      position: relative;
      z-index: 2;
      display: grid;
      justify-items: center;
      align-items: start;
      gap: 62px;
      min-height: 480px;
    }

    .layer {
      position: relative;
      min-width: 170px;
      display: grid;
      gap: 10px;
      justify-items: center;
    }

    .layer::after {
      content: "";
      width: 1px;
      height: 34px;
      background: var(--line-strong);
      opacity: 0.5;
      position: absolute;
      bottom: -48px;
      left: 50%;
    }

    .layer:last-child::after {
      display: none;
    }

    .layer-title {
      display: grid;
      gap: 3px;
      justify-items: center;
      min-height: 44px;
      text-align: center;
    }

    .layer-title b {
      font-size: 14px;
    }

    .layer-title span {
      color: var(--muted);
      font-size: 11px;
    }

    .neuron-grid {
      display: grid;
      grid-template-columns: repeat(var(--cols), var(--node-size));
      gap: 5px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.86);
    }

    .network-canvas.is-expanded {
      min-width: max-content;
      padding: 32px 54px 54px;
    }

    .layers.is-expanded {
      display: flex;
      align-items: flex-start;
      justify-items: start;
      gap: 150px;
      min-height: 720px;
    }

    .layers.is-expanded .layer {
      min-width: 112px;
    }

    .layers.is-expanded .layer::after {
      display: none;
    }

    .layers.is-expanded .neuron-grid {
      grid-template-columns: 1fr;
      gap: 7px;
      padding: 9px;
    }

    .layers.is-expanded .neuron {
      width: 56px;
      height: 30px;
      font-size: 10px;
      border-radius: 6px;
    }

    .neuron {
      width: var(--node-size);
      height: var(--node-size);
      border: 1px solid rgba(0, 0, 0, 0.28);
      border-radius: 7px;
      display: grid;
      place-items: center;
      font-family: Consolas, monospace;
      font-size: var(--node-font);
      line-height: 1;
      overflow: hidden;
      white-space: nowrap;
      transition: transform 140ms ease, box-shadow 140ms ease;
    }

    .neuron:hover {
      transform: scale(1.08);
      box-shadow: 0 0 0 2px #fff, 0 8px 18px rgba(0, 0, 0, 0.18);
      z-index: 5;
    }

    .neuron[data-selectable] {
      cursor: pointer;
    }

    .neuron.is-selected {
      box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--yellow), 0 12px 24px rgba(0, 0, 0, 0.24);
      transform: scale(1.1);
      z-index: 6;
    }

    .summary-panel {
      border-top: 1px solid var(--line);
      padding: 12px 14px;
      display: grid;
      gap: 8px;
      background: #fff;
    }

    .summary-list {
      display: grid;
      gap: 8px;
    }

    .summary-item {
      display: grid;
      grid-template-columns: 110px 1fr 88px;
      gap: 10px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }

    .summary-bar {
      display: grid;
      grid-template-columns: repeat(20, 1fr);
      gap: 2px;
      min-height: 18px;
    }

    .summary-cell {
      border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, 0.12);
    }

    .weight-inspector {
      border-top: 1px solid var(--line);
      background: #fff;
      display: grid;
      gap: 12px;
      padding: 14px;
    }

    .weight-inspector-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .weight-inspector-head h3 {
      margin: 0;
      font-size: 16px;
    }

    .weight-inspector-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .weight-chip {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 7px 9px;
      background: #f9faf9;
      color: var(--muted);
      font-size: 12px;
    }

    .weight-chip b {
      color: var(--ink);
      font-family: Consolas, monospace;
    }

    .weight-sections {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .weight-section {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fbfbfb;
      overflow: hidden;
      min-width: 0;
    }

    .weight-section h4 {
      margin: 0;
      padding: 10px 11px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      font-size: 13px;
    }

    .weight-table {
      display: grid;
      gap: 5px;
      max-height: 280px;
      overflow: auto;
      padding: 9px;
    }

    .weight-row {
      display: grid;
      grid-template-columns: minmax(74px, 96px) minmax(0, 1fr) 76px;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    .weight-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .weight-bar {
      height: 12px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 6px;
      background: #edf0f1;
      overflow: hidden;
    }

    .weight-fill {
      height: 100%;
      width: max(4px, calc(var(--strength) * 100%));
      border-radius: 6px;
      background: var(--bar-color);
    }

    .weight-value {
      color: var(--ink);
      font-family: Consolas, monospace;
      text-align: right;
    }

    .weight-empty {
      color: var(--muted);
      border: 1px dashed var(--line-strong);
      border-radius: 7px;
      padding: 12px;
      background: #fff;
      font-size: 13px;
    }

    .contribution-section {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fbfbfb;
      overflow: hidden;
    }

    .contribution-head {
      padding: 10px 11px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      display: grid;
      gap: 4px;
    }

    .contribution-head-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .contribution-head h4 {
      margin: 0;
      font-size: 13px;
    }

    .contribution-mode-group {
      display: inline-flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .mini-mode-button {
      min-height: 28px;
      padding: 5px 9px;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font-size: 12px;
    }

    .mini-mode-button.is-active {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
    }

    .contribution-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(54px, 1fr));
      gap: 7px;
      padding: 11px;
    }

    .contribution-cell {
      aspect-ratio: 1;
      border: 1px solid rgba(0, 0, 0, 0.2);
      border-radius: 7px;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 4px;
      padding: 6px 4px;
      text-align: center;
      font-family: Consolas, "Microsoft YaHei", monospace;
    }

    .contribution-name {
      font-size: 10px;
      line-height: 1.1;
      opacity: 0.92;
    }

    .contribution-value {
      font-size: 11px;
      line-height: 1.2;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .contribution-formula {
      padding: 0 11px 11px;
      color: var(--muted);
      font-family: Consolas, "Microsoft YaHei", monospace;
      font-size: 12px;
      line-height: 1.5;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .output-controls,
    .preset-tools {
      display: grid;
      gap: 10px;
    }

    .preset-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .status-banner {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 9px 10px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .status-banner.is-success {
      border-color: rgba(0, 159, 122, 0.35);
      background: rgba(0, 159, 122, 0.08);
      color: #086a53;
    }

    .status-banner.is-error {
      border-color: rgba(228, 63, 100, 0.35);
      background: rgba(228, 63, 100, 0.08);
      color: #9f1636;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .layer-configs,
    .output-configs,
    .sample-list {
      display: grid;
      gap: 9px;
    }

    .config-row,
    .output-row,
    .sample-row {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 9px;
      display: grid;
      gap: 8px;
      background: #fff;
    }

    .config-row {
      grid-template-columns: 48px 1fr 1fr;
      align-items: end;
    }

    .config-row b {
      align-self: center;
    }

    .output-row {
      grid-template-columns: 1fr 74px 74px;
    }

    .collapsible-panel {
      overflow: hidden;
    }

    .collapsible-trigger {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: #fff;
      color: var(--ink);
      padding: 13px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
      box-shadow: none;
    }

    .collapsible-trigger:hover {
      transform: none;
      box-shadow: none;
      background: #f8faf9;
    }

    .collapsible-title {
      display: grid;
      gap: 3px;
    }

    .collapsible-title b {
      font-size: 16px;
    }

    .collapsible-title span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .collapse-mark {
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      min-width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      font-weight: 700;
      transition: transform 160ms ease;
    }

    .collapsible-panel.is-collapsed .collapse-mark {
      transform: rotate(-90deg);
    }

    .collapsible-body {
      display: grid;
    }

    .collapsible-panel.is-collapsed .collapsible-body {
      display: none;
    }

    .label-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .label-actions .negative {
      background: var(--pink);
      border-color: var(--pink);
    }

    .output-statuses {
      display: grid;
      gap: 8px;
    }

    .output-status {
      border: 1px solid var(--line);
      border-left: 5px solid var(--muted);
      border-radius: 7px;
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      background: #fff;
    }

    .output-status.yes {
      border-left-color: var(--teal);
    }

    .output-status.no {
      border-left-color: var(--pink);
    }

    .output-status strong {
      display: block;
      font-size: 14px;
    }

    .output-status span {
      color: var(--muted);
      font-size: 12px;
    }

    .output-calc {
      margin-top: 4px;
      color: var(--muted);
      font-family: Consolas, "Microsoft YaHei", monospace;
      font-size: 11px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .badge {
      min-width: 44px;
      border-radius: 7px;
      padding: 7px 9px;
      text-align: center;
      font-weight: 700;
      color: #fff;
      background: var(--muted);
    }

    .yes .badge {
      background: var(--teal);
    }

    .no .badge {
      background: var(--pink);
    }

    .sample-row {
      grid-template-columns: 1fr auto auto;
      align-items: center;
      font-size: 12px;
    }

    .sample-targets {
      color: var(--muted);
      font-family: Consolas, monospace;
      overflow-wrap: anywhere;
    }

    .small-button {
      min-height: 30px;
      padding: 5px 8px;
      font-size: 12px;
    }

    .empty {
      color: var(--muted);
      border: 1px dashed var(--line-strong);
      border-radius: 7px;
      padding: 12px;
      text-align: center;
      background: #fff;
      font-size: 13px;
    }

    @media (max-width: 1180px) {
      .app {
        grid-template-columns: minmax(260px, 340px) minmax(0, 1fr);
      }

      .right-side {
        grid-column: 1 / -1;
        grid-template-columns: repeat(2, minmax(280px, 1fr));
      }
    }

    @media (max-width: 780px) {
      .app,
      .right-side {
        grid-template-columns: 1fr;
      }

      .network-scroll {
        min-height: 390px;
      }

      .summary-item {
        grid-template-columns: 1fr;
      }

      .weight-sections {
        grid-template-columns: 1fr;
      }

      .weight-row {
        grid-template-columns: 68px minmax(0, 1fr) 70px;
      }

      .contribution-grid {
        grid-template-columns: repeat(5, minmax(48px, 1fr));
      }

      .contribution-name {
        font-size: 9px;
      }

      .contribution-value {
        font-size: 10px;
      }

      .output-row,
      .config-row,
      .form-grid,
      .preset-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>神经网络像素画布可视化</h1>
    <p>在 5x5 画布上画图，配置隐藏层和激活函数，把当前图案标成目标值，然后看一个小型神经网络怎样把明暗一路传到输出。</p>
  </header>

  <main class="app">
    <aside class="side">
      <section class="panel">
        <div class="section">
          <div class="section-title">
